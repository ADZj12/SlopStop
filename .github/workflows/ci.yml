name: ci

# The pipeline gate. Every push and every pull request must pass tests and the
# secret scan before it can be merged. This is where the push boundary stops
# depending on any one person remembering to run the check locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e ".[dev]"
      - name: run tests
        run: python -m pytest -q
      - name: assert zero runtime dependencies
        # A supply chain security tool must not add runtime packages. This
        # fails the build if any runtime dependency ever sneaks into the
        # installed distribution metadata.
        run: |
          python - <<'PY'
          import importlib.metadata as m
          reqs = m.requires("slopstop") or []
          runtime = [r for r in reqs if "extra ==" not in r]
          assert not runtime, f"unexpected runtime deps: {runtime}"
          print("confirmed: zero runtime dependencies")
          PY

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan tracked files for secrets
        run: bash scripts/check_secrets.sh
